[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "satquery-ai"
version = "0.1.0"
description = "Interactive Vision-Language Assistant for Multimodal Remote-Sensing Image Analysis (Academic ML Project)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SatQuery AI Team", email = "navaneeth@example.com" }
]
keywords = [
    "remote-sensing",
    "satellite-imagery",
    "multimodal",
    "task-router",
    "vqa",
    "change-detection",
    "machine-learning"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS"
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]
advanced = [
    "rasterio>=1.3.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "xgboost>=2.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["satquery*"]
